services:
  sivitDB:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sivit
      POSTGRES_USER: sivit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
    volumes: [db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sivit"]
      interval: 5s
      retries: 10

  portal:
    build: .
    environment:
      DATABASE_URL: postgres://sivit:${POSTGRES_PASSWORD:-devpass}@sivitDB:5432/sivit
      PORTAL_SERVICE_TOKEN: ${PORTAL_TOKEN:-dev-portal-token}
    volumes:
      - static_files:/var/www/static
    expose: ["8000"]            # deixa de estar publicado no host: só o Nginx lhe chega
    depends_on:
      sivitDB: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    ports: ["${PORTA_NGINX:-80}:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/var/www/static:ro
    depends_on:
      portal: { condition: service_healthy }

volumes:
  db_data:
  static_files:

# TP4: acrescenta ao compose de TP2/TP3 o serviço de ingestão e o gerador de carga.
#
# Copiar para a raiz do repositório, ao lado do docker-compose.yml. O
# `docker compose` junta os dois ficheiros sozinho; não é preciso -f.
# (Se o vosso ficheiro se chama compose.yaml, chamar a este compose.override.yaml.)
services:

  # 1. Serviço novo: o broker. A consola de gestão fica em localhost:15672.
  broker:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: sivit
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-devpass}
    ports: ["${PORTA_BROKER:-15672}:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  portal:
    environment:
      # Latência artificial, para a falha em cascata do exercício 3.
      # Precisa do middleware de portal/vigilancia/middleware.py.
      LATENCIA_MS: ${LATENCIA_MS:-0}
      # Resposta perdida (TP3-E2): 0 = desligado. Ex.: DROP_RESPONSE_PROB=0.3
      DROP_RESPONSE_PROB: ${DROP_RESPONSE_PROB:-0}

  ingestao:
    build: ./ingestao
    environment:
      DATABASE_URL: postgres://sivit:${POSTGRES_PASSWORD:-devpass}@sivitDB:5432/sivit
      PORTAL_URL: http://portal:8000
      PORTAL_TOKEN: ${PORTAL_TOKEN:-dev-portal-token}
      GATEWAY_TOKENS: ${GATEWAY_TOKEN:-dev-gateway-token}
      AMQP_URL: amqp://sivit:${RABBITMQ_PASSWORD:-devpass}@broker:5672/
      POR_FILA: ${POR_FILA:-1}
      CONFIRMS: ${CONFIRMS:-1}
      # off | sincrona | timeout | retry | disjuntor | cache (cumulativos)
      MODO_VALIDACAO: ${MODO_VALIDACAO:-cache}
    depends_on:
      sivitDB: { condition: service_healthy }
      broker: { condition: service_healthy }
    ports: ["${PORTA_INGESTAO:-8001}:8001"]


  # Simulador de gateway (RF1). Arrancar com:
  #   docker compose --profile ferramentas up -d simulador
  # O buffer fica num volume: se o simulador reiniciar com a ingestão em baixo,
  # não perde as leituras guardadas.
  simulador:
    build: ./ferramentas
    entrypoint: ["python", "simulador.py"]
    command: ["http://ingestao:8001/v1/leituras", "--dispositivos", "20", "--lote", "10", "--intervalo", "1"]
    environment:
      BUFFER_FILE: /dados/buffer_leituras.json
      INGESTAO_TOKEN: ${GATEWAY_TOKEN:-dev-gateway-token}
    volumes: [simulador_buffer:/dados]
    profiles: [ferramentas]
    


  # Gerador de carga: só corre quando chamado, e termina no fim da medição.
  #   docker compose run --rm carga http://ingestao:8001/teste/assincrono --concorrencia 50 --duracao 10
  carga:
    build: ./ferramentas
    profiles: [ferramentas]
    environment:
      INGESTAO_TOKEN: ${GATEWAY_TOKEN:-dev-gateway-token}
  
  # Os consumidores: uma imagem (./workers), um script cada. O código é
  #    vosso. As variáveis são os botões das experiências: o vosso código
  #    deve lê-las (ver o README), para se mudar o comportamento com
  #      PREFETCH=1 TRABALHO_MS=20 docker compose up -d worker_alarmes
  worker_arquivo:
    build: ./workers
    command: python arquivo.py
    environment: &ambiente_worker
      AMQP_URL: amqp://sivit:${RABBITMQ_PASSWORD:-devpass}@broker:5672/
      DATABASE_URL: postgres://sivit:${POSTGRES_PASSWORD:-devpass}@sivitDB:5432/sivit
      PREFETCH: ${PREFETCH:-10}
      ACK_AUTOMATICO: ${ACK_AUTOMATICO:-0}
      TRABALHO_MS: ${TRABALHO_MS:-0}
      SEM_ON_CONFLICT: ${SEM_ON_CONFLICT:-0}
      MORRER_APOS: ${MORRER_APOS:-0}
      MORRER_ANTES_DO_ACK: ${MORRER_ANTES_DO_ACK:-0}
      MAX_MENSAGENS: ${MAX_MENSAGENS:-100000}
      POLITICA_CHEIA: ${POLITICA_CHEIA:-reject-publish}
    depends_on:
      broker: { condition: service_healthy }
      sivitDB: { condition: service_healthy }

  worker_alarmes:
    build: ./workers
    command: python alarmes.py
    environment: *ambiente_worker
    depends_on:
      broker: { condition: service_healthy }

  worker_painel:
    build: ./workers
    command: python painel.py
    environment: *ambiente_worker
    depends_on:
      broker: { condition: service_healthy }


volumes:
  simulador_buffer:


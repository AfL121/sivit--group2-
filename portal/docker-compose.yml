services:
  sivitDB:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sivit
      POSTGRES_USER: sivit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
    volumes: [db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sivit"]
      interval: 5s
      retries: 10

  portal:
    build: .
    environment:
      DATABASE_URL: postgres://sivit:${POSTGRES_PASSWORD:-devpass}@sivitDB:5432/sivit
    depends_on:
      sivitDB: { condition: service_healthy }
    ports:
      - "8000:8000"

volumes:
  db_data: